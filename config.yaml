# Non-secret settings. Safe to commit. API keys go in .env.

search:
  keywords:
    - "Machine Learning"
    - "Data Scientist"
    - "Ingénieur IA"
    - "Développeur Python"
  location: "Paris"         # free-text location, used by Adzuna
  departement: "75"         # France Travail department filter (null = all of France)
  distance_km: 30
  max_age_days: 3           # must be one of 1, 3, 7, 14, 31 (France Travail constraint)
  max_results_per_source: 50

scoring:
  min_score: 6              # offers scoring below this (out of 10) are skipped

llm:
  analysis_model: "claude-haiku-5-5"   # cheap model: scores every new offer
  writer_model: "claude-sonnet-5-5"    # stronger model: writes CV + letter for matches only
  max_retries: 3

paths:                      # relative paths are resolved against this file's folder
  master_cv: "data/master_cv.yaml"
  output_dir: "output"
  log_dir: "logs"

logging:
  level: "INFO"
